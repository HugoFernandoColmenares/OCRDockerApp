services:
  ocr-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-local-mvp-secret-change-me}
      - APP_PASSWORD=${APP_PASSWORD:-ocr-local}
      - CORS_ORIGINS=http://localhost,http://localhost:8000
    restart: unless-stopped
    container_name: inventory-ocr-scanner
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
      - ./results:/app/results:ro
    depends_on:
      ocr-app:
        condition: service_healthy
    restart: unless-stopped
    container_name: ocr-nginx
